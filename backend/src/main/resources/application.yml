server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        path: /
spring:
  application:
    name: xiaoying-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
app:
  storage-root: ${STORAGE_ROOT:/tmp/xiaoying-files}
  demo-mode: ${DEMO_MODE:true}
  task-workers: ${TASK_WORKERS:2}
  task-queue-capacity: ${TASK_QUEUE_CAPACITY:32}
  simulation-step-delay-ms: ${SIMULATION_STEP_DELAY_MS:3000}
